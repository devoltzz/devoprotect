# The host of the site: static files, no access log.
server {
    listen 80;
    server_name _;
    root /srv/www/current;
    index index.html;
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    charset utf-8;
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location / {
        include /etc/nginx/snippets/devo_headers.conf;
        try_files $uri $uri/ =404;
    }

    location ~* \.mjs$ {
        include /etc/nginx/snippets/devo_headers.conf;
        default_type text/javascript;
        try_files $uri =404;
    }

    location ~* \.webmanifest$ {
        include /etc/nginx/snippets/devo_headers.conf;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /data/ {
        include /etc/nginx/snippets/devo_headers.conf;
        alias /srv/data/;
        try_files $uri =404;
    }
}
